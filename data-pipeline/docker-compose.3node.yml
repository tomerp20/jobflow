# Transient 3-node Cassandra learning lab — not for production use.
# Shut down Ollama and other RAM consumers before starting this.
# Tear down with: docker compose -f docker-compose.3node.yml down -v

services:
  cassandra1:
    image: cassandra:4.1
    container_name: jf-cassandra-1
    ports:
      - "9042:9042"
      - "7199:7199"
    environment:
      - MAX_HEAP_SIZE=3G
      - HEAP_NEWSIZE=600M
      - CASSANDRA_CLUSTER_NAME=jobflow-lab
      - CASSANDRA_SEEDS=cassandra1
    volumes:
      - cassandra1-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 15s
      timeout: 10s
      retries: 20

  cassandra2:
    image: cassandra:4.1
    container_name: jf-cassandra-2
    environment:
      - MAX_HEAP_SIZE=3G
      - HEAP_NEWSIZE=600M
      - CASSANDRA_CLUSTER_NAME=jobflow-lab
      - CASSANDRA_SEEDS=cassandra1
    volumes:
      - cassandra2-data:/var/lib/cassandra
    depends_on:
      cassandra1:
        condition: service_healthy

  cassandra3:
    image: cassandra:4.1
    container_name: jf-cassandra-3
    environment:
      - MAX_HEAP_SIZE=3G
      - HEAP_NEWSIZE=600M
      - CASSANDRA_CLUSTER_NAME=jobflow-lab
      - CASSANDRA_SEEDS=cassandra1
    volumes:
      - cassandra3-data:/var/lib/cassandra
    depends_on:
      cassandra1:
        condition: service_healthy

  reaper:
    image: thelastpickle/cassandra-reaper:latest
    container_name: jf-reaper
    ports:
      - "8080:8080"
    environment:
      - REAPER_STORAGE_TYPE=memory
      - REAPER_CASS_CONTACT_POINTS=[cassandra1]
    depends_on:
      cassandra1:
        condition: service_healthy

volumes:
  cassandra1-data:
  cassandra2-data:
  cassandra3-data:
