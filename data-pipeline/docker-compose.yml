services:
  cassandra:
    image: cassandra:4.1
    container_name: jf-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
      - "7199:7199"  # JMX for Reaper
    environment:
      - MAX_HEAP_SIZE=4G
      - HEAP_NEWSIZE=800M
      - CASSANDRA_CLUSTER_NAME=jobflow
      # Open JMX so the Reaper container can connect to Cassandra over JMX.
      # LOCAL_JMX=no turns off the default localhost-only bind. The JVM extra
      # opts disable JMX authentication (acceptable on a single-host learning
      # deployment) and pin the RMI hostname so Reaper can resolve back to the
      # Cassandra service.
      - LOCAL_JMX=no
      - JVM_EXTRA_OPTS=-Djava.rmi.server.hostname=cassandra -Dcom.sun.jndi.rmiregistry.noLocalStubs=true -Dcom.sun.management.jmxremote.authenticate=false
    volumes:
      - /home/tomer/cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 15s
      timeout: 10s
      retries: 20

  reaper:
    image: thelastpickle/cassandra-reaper:latest
    container_name: jf-reaper
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - REAPER_STORAGE_TYPE=memory
      - REAPER_CASS_CONTACT_POINTS=[cassandra]
      # Disable Reaper's access-control layer. Without this, the latest Reaper
      # image refuses to start with "ACCESS CONTROL: User configuration missing
      # username" because the default config block points at users that aren't
      # defined. Disabling auth is acceptable for a single-host learning
      # deployment behind LAN-only port exposure.
      - REAPER_AUTH_ENABLED=false
    depends_on:
      cassandra:
        condition: service_healthy

  shim:
    build:
      context: ./shim
      dockerfile: Dockerfile
    image: jobflow-shim:local
    container_name: jf-shim
    restart: unless-stopped
    # The shim is reached from the host via the published port; ngrok runs on
    # the host and forwards inbound traffic to 127.0.0.1:3333. Inside the
    # container the process must bind 0.0.0.0 so the published port is
    # reachable from the host network namespace.
    ports:
      - "127.0.0.1:3333:3333"
    environment:
      - SHIM_PORT=3333
      - SHIM_BIND_ADDRESS=0.0.0.0
      # Cassandra is reached over the docker network by service name. The
      # shim should never use the host's 127.0.0.1 — that points to itself
      # from inside the container.
      - CASSANDRA_CONTACT_POINTS=cassandra
      - CASSANDRA_LOCAL_DC=datacenter1
      - CASSANDRA_KEYSPACE=jobflow
      - LOG_LEVEL=info
      - NODE_ENV=production
    env_file:
      # Only contains SHIM_BEARER_TOKEN (the one secret). Created from
      # shim/.env.example on first deploy; not committed.
      - ./shim/.env
    depends_on:
      cassandra:
        condition: service_healthy
